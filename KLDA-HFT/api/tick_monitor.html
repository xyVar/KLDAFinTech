<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KLDA-HFT Live Tick Monitor</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Consolas','Courier New', monospace;
    background: #0a0a0f;
    color: #c8c8d0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── TOP BAR ── */
#topbar {
    background: #0d0d1a;
    border-bottom: 1px solid #1e2a4a;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
}
#topbar .logo { color: #4af; font-size: 15px; font-weight: bold; letter-spacing: 2px; }
#topbar .stat { font-size: 11px; color: #667; }
#topbar .stat span { color: #adf; }
#pulse { width: 8px; height: 8px; border-radius: 50%; background: #2a2a2a; margin-left: auto; }
#pulse.alive { background: #0f0; box-shadow: 0 0 6px #0f0; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── MAIN LAYOUT ── */
#main {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* ── LEFT SIDEBAR ── */
#sidebar {
    width: 220px;
    background: #0d0d1a;
    border-right: 1px solid #1e2a4a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-track { background: #0d0d1a; }
#sidebar::-webkit-scrollbar-thumb { background: #1e2a4a; }

.group-header {
    padding: 8px 12px 4px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #445;
    text-transform: uppercase;
    border-bottom: 1px solid #111;
    position: sticky;
    top: 0;
    background: #0d0d1a;
    z-index: 1;
}

.sym-row {
    padding: 6px 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #0f0f18;
    transition: background 0.1s;
    font-size: 11px;
}
.sym-row:hover { background: #111824; }
.sym-row.active { background: #0d1f33; border-left: 2px solid #4af; }
.sym-row .sym-name { color: #bcd; font-size: 11px; }
.sym-row .sym-bid { color: #0b0; font-size: 10px; font-weight: bold; }
.sym-row .sym-bid.down { color: #c33; }
.sym-row.live .sym-name { color: #7df; }
.sym-row .dot { width:5px; height:5px; border-radius:50%; background:#222; flex-shrink:0; margin-right:4px; }
.sym-row.live .dot { background:#0d0; box-shadow: 0 0 4px #0d0; }

/* ── RIGHT PANEL ── */
#panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0a0a0f;
}

/* ── SYMBOL HEADER ── */
#sym-header {
    padding: 10px 20px;
    background: #0d0d1a;
    border-bottom: 1px solid #1e2a4a;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-shrink: 0;
}
#sym-title { font-size: 20px; color: #4af; font-weight: bold; letter-spacing: 1px; }
#sym-bid   { font-size: 22px; font-weight: bold; color: #0d0; }
#sym-ask   { font-size: 16px; color: #888; }
#sym-spread { font-size: 11px; color: #556; background: #111; padding: 2px 6px; border-radius: 3px; }
#sym-change { font-size: 13px; margin-left: auto; padding: 3px 8px; border-radius: 3px; }
#sym-change.up   { color: #0d0; background: #0a1a0a; }
#sym-change.down { color: #c33; background: #1a0a0a; }
#sym-age { font-size: 10px; color: #334; }

/* ── EKG BAR ── */
#ekg-bar {
    height: 40px;
    background: #050510;
    border-bottom: 1px solid #1e2a4a;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
}
#ekg-canvas { width: 100%; height: 100%; }

/* ── TICK TABLE ── */
#tick-wrapper {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
}
#tick-wrapper::-webkit-scrollbar { width: 6px; }
#tick-wrapper::-webkit-scrollbar-track { background: #0a0a0f; }
#tick-wrapper::-webkit-scrollbar-thumb { background: #1e2a4a; border-radius: 3px; }

#tick-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
#tick-table thead th {
    position: sticky;
    top: 0;
    background: #0d0d1a;
    color: #556;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 14px;
    text-align: right;
    border-bottom: 1px solid #1e2a4a;
    z-index: 2;
}
#tick-table thead th:first-child { text-align: left; }
#tick-table tbody tr {
    border-bottom: 1px solid #0f0f18;
    transition: opacity 0.3s;
}
#tick-table tbody tr:hover { background: #0d0d1a; }
#tick-table tbody td {
    padding: 5px 14px;
    text-align: right;
    font-size: 11px;
    color: #789;
}
#tick-table tbody td:first-child { text-align: left; color: #445; font-size: 10px; }
.td-bid { font-weight: bold; font-size: 12px !important; }
.td-bid.up   { color: #0c0 !important; }
.td-bid.down { color: #c33 !important; }
.td-ask { color: #667 !important; }
.td-vol { color: #445 !important; font-size: 10px !important; }

/* New row flash animation */
@keyframes newrow {
    0%   { background: #0a1f0a; opacity: 0.6; }
    30%  { background: #0d2a0d; opacity: 1; }
    100% { background: transparent; }
}
.new-tick { animation: newrow 0.8s ease-out forwards; }

/* ── EMPTY STATE ── */
#empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #223;
    gap: 12px;
}
#empty-state .big { font-size: 48px; }
#empty-state .msg { font-size: 13px; color: #334; }
#empty-state .sub { font-size: 11px; color: #223; }

/* ── STATUS BAR ── */
#statusbar {
    background: #070710;
    border-top: 1px solid #1e2a4a;
    padding: 4px 16px;
    display: flex;
    gap: 20px;
    font-size: 10px;
    color: #334;
    flex-shrink: 0;
}
#statusbar span { color: #556; }
#statusbar .ok  { color: #0a0; }
#statusbar .err { color: #a00; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
    <div class="logo">KLDA-HFT</div>
    <div class="stat">TICKS <span id="stat-ticks">—</span></div>
    <div class="stat">SIGNALS <span id="stat-signals">—</span></div>
    <div class="stat">LIVE <span id="stat-live">—</span></div>
    <div class="stat">SERVER <span id="stat-time">—</span></div>
    <div id="pulse"></div>
</div>

<!-- MAIN -->
<div id="main">

    <!-- SIDEBAR: symbol list -->
    <div id="sidebar" id="sidebar">
        <div style="padding:10px 12px 6px; font-size:10px; color:#334; letter-spacing:1px;">
            DOUBLE-CLICK TO OPEN FEED
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="panel">

        <!-- Symbol header -->
        <div id="sym-header">
            <div id="sym-title">—</div>
            <div id="sym-bid">—</div>
            <div id="sym-ask" style="color:#555">—</div>
            <div id="sym-spread">sprd —</div>
            <div id="sym-change" class="up" style="display:none"></div>
            <div id="sym-age"></div>
        </div>

        <!-- EKG canvas -->
        <div id="ekg-bar">
            <canvas id="ekg-canvas"></canvas>
        </div>

        <!-- Tick table or empty state -->
        <div id="tick-wrapper">
            <div id="empty-state">
                <div class="big">◈</div>
                <div class="msg">Select a symbol from the left panel</div>
                <div class="sub">Double-click to open live tick feed</div>
            </div>

            <table id="tick-table" style="display:none">
                <thead>
                    <tr>
                        <th style="text-align:left; width:160px">TIME</th>
                        <th>BID</th>
                        <th>ASK</th>
                        <th>SPREAD</th>
                        <th>VOL</th>
                        <th>BUY VOL</th>
                        <th>SELL VOL</th>
                    </tr>
                </thead>
                <tbody id="tick-body"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- STATUS BAR -->
<div id="statusbar">
    <div>API <span id="api-status" class="err">OFFLINE</span></div>
    <div>DB <span id="db-status" class="err">—</span></div>
    <div>SELECTED <span id="sel-sym">none</span></div>
    <div>TICKS SHOWN <span id="tick-count">0</span></div>
    <div>REFRESH <span>300ms</span></div>
    <div style="margin-left:auto">KLDA-HFT RENAISSANCE ENGINE v2.0</div>
</div>

<script>
const API = 'http://localhost:5001/api';

let selectedSymbol = null;
let lastTickMs     = 0;
let prevBid        = {};
let tickRows       = [];
const MAX_ROWS     = 500;

// EKG state
let ekgPrices = [];
const EKG_LEN = 300;

// ── LOAD SYMBOLS ─────────────────────────────────────────────
async function loadSymbols() {
    try {
        const res = await fetch(`${API}/symbols`);
        const data = await res.json();
        renderSidebar(data);
        document.getElementById('api-status').textContent = 'ONLINE';
        document.getElementById('api-status').className = 'ok';
    } catch(e) {
        document.getElementById('api-status').textContent = 'OFFLINE';
        document.getElementById('api-status').className = 'err';
    }
}

function renderSidebar(groups) {
    const sidebar = document.getElementById('sidebar');
    const hint = sidebar.firstElementChild;
    sidebar.innerHTML = '';
    sidebar.appendChild(hint);

    for (const [group, symbols] of Object.entries(groups)) {
        const hdr = document.createElement('div');
        hdr.className = 'group-header';
        hdr.textContent = `${group} (${symbols.length})`;
        sidebar.appendChild(hdr);

        symbols.forEach(s => {
            const row = document.createElement('div');
            row.className = 'sym-row' + (s.live ? ' live' : '');
            row.dataset.symbol = s.symbol;
            row.innerHTML = `
                <div class="dot"></div>
                <div class="sym-name">${s.symbol}</div>
                <div class="sym-bid ${s.bid === 0 ? '' : ''}">${s.bid > 0 ? s.bid.toFixed(s.bid > 100 ? 2 : 5) : '—'}</div>
            `;
            row.addEventListener('dblclick', () => selectSymbol(s.symbol, row));
            row.addEventListener('click', () => selectSymbol(s.symbol, row));
            sidebar.appendChild(row);
        });
    }
}

// ── SELECT SYMBOL ─────────────────────────────────────────────
function selectSymbol(sym, rowEl) {
    document.querySelectorAll('.sym-row.active').forEach(r => r.classList.remove('active'));
    rowEl.classList.add('active');

    selectedSymbol = sym;
    lastTickMs     = 0;
    tickRows       = [];
    ekgPrices      = [];

    document.getElementById('sym-title').textContent  = sym;
    document.getElementById('sym-bid').textContent    = '—';
    document.getElementById('sym-ask').textContent    = '—';
    document.getElementById('sym-spread').textContent = 'sprd —';
    document.getElementById('sym-change').style.display = 'none';
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('tick-table').style.display  = 'table';
    document.getElementById('tick-body').innerHTML = '';
    document.getElementById('tick-count').textContent = '0';
    document.getElementById('sel-sym').textContent = sym;

    fetchTicks();
}

// ── FETCH TICKS ──────────────────────────────────────────────
async function fetchTicks() {
    if (!selectedSymbol) return;
    try {
        const url = lastTickMs > 0
            ? `${API}/ticks/${encodeURIComponent(selectedSymbol)}?since=${lastTickMs}&limit=50`
            : `${API}/ticks/${encodeURIComponent(selectedSymbol)}?limit=100`;

        const res  = await fetch(url);
        const data = await res.json();

        if (data.ticks && data.ticks.length > 0) {
            // ticks come DESC — reverse to get oldest first for prepend
            const newTicks = [...data.ticks].reverse();

            newTicks.forEach(t => {
                prependTick(t);
                ekgPrices.push(t.bid);
                if (ekgPrices.length > EKG_LEN) ekgPrices.shift();
            });

            // Update last timestamp
            const latest = data.ticks[0]; // DESC = most recent first
            lastTickMs = latest.time_ms;

            // Update header
            updateHeader(latest);

            // Trim rows
            while (tickRows.length > MAX_ROWS) {
                const last = tickRows.pop();
                if (last.parentNode) last.parentNode.removeChild(last);
            }

            document.getElementById('tick-count').textContent = tickRows.length;
            drawEkg();
        }

        document.getElementById('db-status').textContent = 'OK';
        document.getElementById('db-status').className   = 'ok';
        document.getElementById('pulse').className = 'alive';

    } catch(e) {
        document.getElementById('db-status').textContent = 'ERR';
        document.getElementById('db-status').className   = 'err';
    }
}

function prependTick(t) {
    const tbody = document.getElementById('tick-body');
    const prev  = prevBid[selectedSymbol] || t.bid;
    const dir   = t.bid > prev ? 'up' : t.bid < prev ? 'down' : '';
    prevBid[selectedSymbol] = t.bid;

    const timeStr = new Date(t.time_ms).toISOString().replace('T',' ').substring(0,23);
    const bidStr  = t.bid  > 100 ? t.bid.toFixed(2)  : t.bid.toFixed(5);
    const askStr  = t.ask  > 100 ? t.ask.toFixed(2)  : t.ask.toFixed(5);
    const spdStr  = t.spread > 0 ? t.spread.toFixed(1) : '—';

    const tr = document.createElement('tr');
    tr.className = 'new-tick';
    tr.innerHTML = `
        <td>${timeStr}</td>
        <td class="td-bid ${dir}">${bidStr}</td>
        <td class="td-ask">${askStr}</td>
        <td>${spdStr}</td>
        <td class="td-vol">${t.volume || '—'}</td>
        <td class="td-vol" style="color:#0a0a">${t.buy_vol  || '—'}</td>
        <td class="td-vol" style="color:#0a00">${t.sell_vol || '—'}</td>
    `;

    tbody.insertBefore(tr, tbody.firstChild);
    tickRows.unshift(tr);
}

function updateHeader(t) {
    const prev = prevBid[selectedSymbol] || t.bid;
    const diff = t.bid - prev;
    const pct  = prev > 0 ? (diff / prev * 100) : 0;
    const dir  = diff >= 0 ? 'up' : 'down';
    const arrow = diff >= 0 ? '▲' : '▼';

    const bidEl = document.getElementById('sym-bid');
    bidEl.textContent = t.bid > 100 ? t.bid.toFixed(2) : t.bid.toFixed(5);
    bidEl.style.color = diff > 0 ? '#0d0' : diff < 0 ? '#c33' : '#0d0';

    document.getElementById('sym-ask').textContent    = `/ ${t.ask > 100 ? t.ask.toFixed(2) : t.ask.toFixed(5)}`;
    document.getElementById('sym-spread').textContent = `sprd ${t.spread > 0 ? t.spread.toFixed(1) : '—'}`;

    const chg = document.getElementById('sym-change');
    if (diff !== 0) {
        chg.style.display = 'block';
        chg.className = dir;
        chg.textContent = `${arrow} ${Math.abs(diff).toFixed(t.bid > 100 ? 2 : 5)} (${pct.toFixed(3)}%)`;
    }
}

// ── EKG CANVAS ───────────────────────────────────────────────
function drawEkg() {
    const canvas = document.getElementById('ekg-canvas');
    const W = canvas.offsetWidth;
    const H = canvas.offsetHeight;
    canvas.width  = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, W, H);

    if (ekgPrices.length < 2) return;

    const prices = ekgPrices.slice(-W);
    const min  = Math.min(...prices);
    const max  = Math.max(...prices);
    const rng  = max - min || 0.0001;

    // Background grid lines
    ctx.strokeStyle = '#0d0d1a';
    ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 10) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Gradient fill
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0,   'rgba(0,180,100,0.25)');
    grad.addColorStop(1,   'rgba(0,180,100,0)');

    ctx.beginPath();
    prices.forEach((p, i) => {
        const x = (i / (prices.length - 1)) * W;
        const y = H - ((p - min) / rng) * (H - 4) - 2;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // EKG line
    ctx.beginPath();
    ctx.strokeStyle = '#00cc66';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#00cc66';
    ctx.shadowBlur = 4;
    prices.forEach((p, i) => {
        const x = (i / (prices.length - 1)) * W;
        const y = H - ((p - min) / rng) * (H - 4) - 2;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Moving dot at right edge
    const last = prices[prices.length - 1];
    const dotY = H - ((last - min) / rng) * (H - 4) - 2;
    ctx.beginPath();
    ctx.arc(W - 2, dotY, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#00ff88';
    ctx.shadowBlur = 8;
    ctx.fill();
}

// ── STATS REFRESH ─────────────────────────────────────────────
async function refreshStats() {
    try {
        const res  = await fetch(`${API}/stats`);
        const data = await res.json();
        document.getElementById('stat-ticks').textContent   = data.ticks_total.toLocaleString();
        document.getElementById('stat-signals').textContent = data.signals_total.toLocaleString();
        document.getElementById('stat-live').textContent    = data.live_symbols;
        document.getElementById('stat-time').textContent    = data.server_time.substring(11,19);
    } catch(e) {}
}

// ── UPDATE SIDEBAR PRICES ─────────────────────────────────────
async function refreshSidebarPrices() {
    try {
        const res  = await fetch(`${API}/current`);
        const rows = await res.json();
        const map  = {};
        rows.forEach(r => map[r.symbol] = r);

        document.querySelectorAll('.sym-row').forEach(el => {
            const sym = el.dataset.symbol;
            const r   = map[sym];
            if (!r) return;
            const bidEl = el.querySelector('.sym-bid');
            const prev  = parseFloat(bidEl.dataset.prev || r.bid);
            bidEl.textContent  = r.bid > 100 ? r.bid.toFixed(2) : r.bid.toFixed(5);
            bidEl.className    = 'sym-bid ' + (r.bid > prev ? 'up' : r.bid < prev ? 'down' : '');
            bidEl.dataset.prev = r.bid;
            el.classList.add('live');
            el.querySelector('.dot').style.background = '#0d0';
        });
    } catch(e) {}
}

// ── MAIN LOOP ─────────────────────────────────────────────────
loadSymbols();
setInterval(fetchTicks,           300);   // tick feed  300ms
setInterval(refreshSidebarPrices, 1000);  // sidebar    1s
setInterval(refreshStats,         3000);  // stats      3s
setInterval(loadSymbols,          30000); // full reload 30s
</script>
</body>
</html>
